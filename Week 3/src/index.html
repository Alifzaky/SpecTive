<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpecTive - Week 3 Full UI</title>
    <!-- Pastikan path ini sesuai dengan lokasi output Tailwind kamu -->
    <link rel="stylesheet" href="output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-50 dark:bg-[#090D16] text-slate-800 dark:text-slate-200 transition-colors duration-300">

    <!-- 1. NAVBAR (Sesuai desain aslimu) -->
    <nav class="border-b border-slate-200 dark:border-slate-800/80 bg-white/90 dark:bg-[#0b0f19]/90 backdrop-blur-md sticky top-0 z-50 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-8 h-16 flex items-center justify-between">
            <a href="#" class="flex items-center space-x-3 group">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-sky-500 to-blue-600 flex items-center justify-center font-extrabold text-slate-950 shadow-lg shadow-sky-500/20 text-lg transition-transform group-hover:scale-105 duration-300">S</div>
                <span class="font-extrabold text-xl text-slate-900 dark:text-white tracking-wide">SpecTive</span>
            </a>

            <div class="hidden md:flex items-center space-x-6 text-sm font-medium">
                <a href="#katalog" class="hover:text-sky-500 dark:hover:text-sky-400 transition-colors">Katalog</a>
                <a href="#konsultasi" class="hover:text-sky-500 dark:hover:text-sky-400 transition-colors">Konsultasi</a>
            </div>

            <div class="flex items-center gap-3">
                <!-- Tombol Theme Toggle (Event Handling) -->
                <button id="theme-toggle" class="w-9 h-9 rounded-lg bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 flex items-center justify-center text-slate-700 dark:text-sky-400 hover:border-sky-500 transition-colors focus:outline-none">
                    <i id="theme-icon" class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- 2. HEADER / HERO -->
    <header class="max-w-3xl mx-auto text-center px-4 py-16 space-y-4">
        <span class="inline-flex items-center gap-2 text-xs font-semibold uppercase tracking-widest text-sky-600 dark:text-sky-400 bg-sky-50 dark:bg-sky-950/60 border border-sky-200 dark:border-sky-800/60 px-3.5 py-1.5 rounded-full">
            Sprint 02 - DOM Manipulation
        </span>
        <h1 class="text-4xl sm:text-5xl font-black text-slate-900 dark:text-white tracking-tight">Katalog Laptop</h1>
        <p class="text-slate-600 dark:text-slate-400">Data dirender otomatis menggunakan JavaScript murni.</p>
    </header>

    <!-- 3. KATALOG CONTAINER (DOM Injection Target) -->
    <main class="max-w-7xl mx-auto px-4 sm:px-8 pb-16">
        <div id="laptop-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- JS akan merender card laptop di sini -->
        </div>
    </main>

    <!-- 4. FORM KONSULTASI -->
    <section id="konsultasi" class="bg-white dark:bg-[#111827] border-y border-slate-200 dark:border-slate-800/90 py-16 transition-colors duration-300">
        <div class="max-w-xl mx-auto px-4">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold text-slate-900 dark:text-white mb-2">Konsultasi Pemilihan Laptop</h2>
                <p class="text-sm text-slate-500">Tanyakan kebutuhan spesifikasimu di sini.</p>
            </div>
            
            <form id="consultation-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Nama Lengkap</label>
                    <input type="text" id="consult-name" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white focus:ring-2 focus:ring-sky-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Pesan / Kebutuhan</label>
                    <textarea id="consult-message" rows="4" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white focus:ring-2 focus:ring-sky-500 outline-none transition-all"></textarea>
                </div>
                <button type="submit" class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold py-3 rounded-lg transition-colors">
                    Kirim Pesan
                </button>
            </form>
        </div>
    </section>

    <!-- 5. FOOTER -->
    <footer class="bg-slate-100 dark:bg-[#070a11] border-t border-slate-200 dark:border-slate-800/80 py-8 transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 text-center space-y-4">
            <div class="flex items-center justify-center space-x-2">
                <div class="w-6 h-6 rounded bg-gradient-to-tr from-sky-500 to-blue-600 flex items-center justify-center font-bold text-slate-950 text-xs">S</div>
                <span class="font-extrabold text-slate-900 dark:text-white">SpecTive</span>
            </div>
            <p class="text-xs text-slate-500">&copy; 2026 SpecTive Platform. All rights reserved.</p>
        </div>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
